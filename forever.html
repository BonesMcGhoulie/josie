    <script>
        function updateImageByTime() {
            const hour = new Date().getHours();
            const imgElement = document.getElementById('time-image');

            if (hour < 3) {
                imgElement.src = "images/horrorsie.png";
                imgElement.alt = " ";
            } else if (hour < 4) {
                imgElement.src = "images/forever.png";
                imgElement.alt = "Pages are FOREVER";
            } else {
                imgElement.src = "images/horrorsie.png";
                imgElement.alt = " ";
            }
        }

        updateImageByTime();
    </script>

    <script>
    window.addEventListener('DOMContentLoaded', () => {
    const audioElement = document.getElementById('audio');
    const currentHour = new Date().getHours();

    if (currentHour < 3) {
        audioElement.src = "audio/halloween/man.ogg";
    } else if (currentHour < 4) {
        audioElement.src = "audio/halloween/wind.ogg";
        audio.volume = 1.00;
    } else {
        audioElement.src = "audio/halloween/man.ogg";
    }

    audioElement.load(); 
});

  </script>

<script>
  // 1. Get the current hour (0 - 23)
  const hour = new Date().getHours();

  // 2. Change text based on the hour
  if (hour < 3) {

</script>
